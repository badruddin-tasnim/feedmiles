<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FeedMiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header class="top">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="22" height="22" />
        <span>FeedMiles</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <nav class="segmented" role="tablist" aria-label="Range">
      <button role="tab" data-range="today" aria-selected="true">Today</button>
      <button role="tab" data-range="week">7 days</button>
      <button role="tab" data-range="month">30 days</button>
      <button role="tab" data-range="all">All time</button>
      <span class="thumb" aria-hidden="true"></span>
    </nav>

    <section class="hero card fade-up">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-label" id="heroLabel">Scrolled today</div>
      <div class="hero-value"><span id="heroNumber">0</span><span class="hero-unit" id="heroUnit">m</span></div>
      <div class="hero-compare" id="heroCompare"><span class="emoji">🛋️</span><span>Nothing scrolled yet.</span></div>
      <div class="hero-meta">
        <span id="heroTime" title="Active scrolling time">⏱ 0s</span>
        <span class="dot">·</span>
        <span id="heroAvg" title="Average per day">—</span>
      </div>
    </section>

    <section class="card milestone fade-up" style="animation-delay:.05s">
      <div class="ms-row">
        <span class="ms-emoji" id="msEmoji">🗼</span>
        <div class="ms-text">
          <div class="ms-title">Next up: <b id="msName">the Eiffel Tower</b></div>
          <div class="tiny" id="msRemaining">330 m to go</div>
        </div>
        <span class="ms-pct" id="msPct">0%</span>
      </div>
      <div class="bar"><div class="bar-fill" id="msBar" style="width:0%"></div></div>
    </section>

    <section class="card chart fade-up" style="animation-delay:.1s">
      <div class="section-head">
        <span class="section-title" id="chartTitle">Last 7 days</span>
        <span class="tiny" id="chartHint">tap a bar for details</span>
      </div>
      <div class="bars" id="bars" role="img" aria-label="Daily scroll distance"></div>
    </section>

    <section class="card sites fade-up" style="animation-delay:.15s">
      <div class="section-head">
        <span class="section-title">By site</span>
        <span class="tiny" id="sitesCount"></span>
      </div>
      <ul class="site-list" id="siteList"></ul>
      <div class="empty" id="sitesEmpty" hidden>
        <div class="empty-emoji">🧭</div>
        <div>No scrolling recorded yet. Open Instagram or Facebook and start thumbing.</div>
      </div>
    </section>

    <footer class="foot tiny">
      <span id="calibNote">Calibrated for a 24" screen</span>
      <a href="#" id="calibLink">change</a>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
